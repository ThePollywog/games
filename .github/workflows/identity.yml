name: Pollywog identity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The PR's own head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: sh scripts/check-identity.sh HEAD
